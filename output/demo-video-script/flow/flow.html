<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#fff;font-family:"Microsoft YaHei","PingFang SC",sans-serif}</style>
</head><body>
<svg viewBox="0 0 680 336" width="680" height="336" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="680" height="336" rx="12" fill="#FFFFFF" stroke="#E6E3DA" stroke-width="0.5"/>
  <text x="40" y="32" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">开场 20 秒：市面上的 AI 给你一段文字，这个给你一个能直接交的文件</text>
  <text x="40" y="58" font-size="11" fill="#5F5E5A" dominant-baseline="central">第一段 · 逛一圈界面，2 分 30 秒（含开场），只为让人知道东西在哪儿</text>

  <g>
    <rect x="41" y="70" width="136" height="62" rx="8" fill="#FCFCFA" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
    <text x="109" y="88" font-size="13" font-weight="500" fill="#888780" text-anchor="middle" dominant-baseline="central">① 首页</text>
    <text x="109" y="106" font-size="11" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">20 秒 · 可略</text>
    <text x="109" y="122" font-size="11" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">顺带提一句知识库</text>
  </g>
  <line x1="179" y1="101" x2="191" y2="101" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="195" y="70" width="136" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="263" y="88" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">② 产物中心</text>
    <text x="263" y="106" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">40 秒 · 重点</text>
    <text x="263" y="122" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">两个下拉能叠着用</text>
  </g>
  <line x1="333" y1="101" x2="345" y2="101" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="349" y="70" width="136" height="62" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="417" y="88" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">③ 设置</text>
    <text x="417" y="106" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">45 秒 · 讲清</text>
    <text x="417" y="122" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">填 Key · 换深浅色</text>
  </g>
  <line x1="487" y1="101" x2="499" y2="101" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="503" y="70" width="136" height="62" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="571" y="88" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">④ 技能</text>
    <text x="571" y="106" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">25 秒 · 讲清</text>
    <text x="571" y="122" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">让它自己写一个</text>
  </g>

  <line x1="41" y1="146" x2="638" y2="146" stroke="#C6C4BA" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="340" y1="146" x2="340" y2="192" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="172" font-size="11" fill="#5F5E5A" dominant-baseline="central">第二段 · 开始干活，4 分 50 秒，分数全在这儿</text>

  <g>
    <rect x="40" y="200" width="170" height="72" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="125" y="221" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">⑤ 对话框</text>
    <text x="125" y="240" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">70 秒 · 重点</text>
    <text x="125" y="258" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">增强提示词 · 自动选线路</text>
  </g>
  <line x1="212" y1="236" x2="225" y2="236" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="230" y="196" width="240" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <text x="350" y="219" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">⑥ 出文件</text>
    <text x="350" y="240" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">200 秒 · 全片主戏</text>
    <text x="350" y="258" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">拖进去 → 看预览 → Word 真的打开</text>
  </g>
  <line x1="472" y1="236" x2="485" y2="236" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="490" y="200" width="150" height="72" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="565" y="221" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">⑦ 收尾</text>
    <text x="565" y="240" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">20 秒 · 讲清</text>
    <text x="565" y="258" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">让它自己删文件</text>
  </g>

  <g>
    <rect x="40" y="302" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="58" y="308" font-size="11" fill="#5F5E5A" dominant-baseline="central">重点：慢慢录，给足镜头</text>
    <rect x="196" y="302" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="214" y="308" font-size="11" fill="#5F5E5A" dominant-baseline="central">讲清：说清楚就走</text>
    <rect x="340" y="302" width="12" height="12" rx="3" fill="#FCFCFA" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
    <text x="358" y="308" font-size="11" fill="#5F5E5A" dominant-baseline="central">可略：一句带过</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
</body></html>
