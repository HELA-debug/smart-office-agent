[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "office-agent-backend"
version = "0.2.0"
description = "Office Agent MVP backend (V2.1 layered)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

# 可选：图片 OCR 与会议录音/视频转写。不打进默认依赖，是因为模型与推理框架
# 加起来几百 MB（onnxruntime + ctranslate2 + whisper 模型），只用文档的用户
# 不该为它付安装体积。装了才有识别能力，没装时健康检查会如实报 false，
# 界面上传图片会提示「识别组件未安装」而不是静默失败。
#   pip install -e "backend[media]"
[project.optional-dependencies]
media = [
    "pillow>=10.0",              # 图片解码校验（上传时就验，不靠扩展名）
    "rapidocr>=3.4",             # PP-OCR 中文模型，随 wheel 附带、离线可用（Paddle 装不上时的兜底）
    "onnxruntime>=1.20",
    "faster-whisper>=1.2",       # CTranslate2 版 whisper，CPU int8 跑得动
    # 锁 15.x：19.x 与 faster-whisper 的 metadata_errors 参数不兼容，
    # 14.4 没有 py3.13 wheel，15.1 是唯一两边都满足的版本
    "av==15.1.0",
    "opencc-python-reimplemented>=0.1.7",  # 繁转简（whisper 中文常吐繁体）
]
# 首选识别引擎。单独一组而不是塞进 media：paddlepaddle 的 Windows wheel 约 105MB，
# 而且首次使用要联网下模型，离线环境硬装会让 `pip install -e "backend[media]"` 直接失败。
# 装了它 OCR_ENGINE=auto 就会优先用它（PP-OCRv5/v6，中文与小字明显更准）。
#   pip install -e "backend[media,ocr-paddle]"
ocr-paddle = [
    "paddlepaddle>=3.0",         # 3.3.1 起有 cp313 win_amd64 wheel
    "paddleocr>=3.0",            # 3.x 用 predict()，返回 rec_texts/rec_scores/rec_polys
]

[tool.setuptools.packages.find]
# `backend/` 是扁平布局：app 是源码包，data/ 与 config/ 只是运行时资源目录
# （desktop_package.json / model_prices.yaml），并不是可分发的 Python 包。
# 不写这条规则时 setuptools 会看到三个顶层目录、判定「无法确定该收哪个」，
# 直接拒绝构建 —— 表现为 `pip install -e "backend[media]"` 在
# "Getting requirements to build editable" 这一步就退出。
include = ["app*"]

[tool.setuptools.package-data]
# 技能说明与提示词都是 .md，setuptools 默认只收 .py；不打进包里，
# 装成 wheel 后 `skills/SKILL.md` 与 `prompts/packs/*.md` 会缺失。
app = ["**/*.md", "evals/*.json", "infra/db/migrations/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ""
filterwarnings = [
    "ignore::DeprecationWarning",
    # TestClient 不接受 timeout 参数（矩阵用例统一传了，方便将来换回真 httpx）
    "ignore:You should not use the 'timeout' argument with the TestClient.*",
]
markers = [
    "e2e: 真起 uvicorn 的端到端用例",
    "real: 真实模型集成测试（需要 RUN_REAL_MODEL_TEST=1 与 DeepSeek Key，默认跳过）",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", 'raise NotImplementedError']

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
# 中文文档/注释中的全角标点属于正常用法
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"app/infra/db/migrations/**" = ["INP001"]
"app/api/**" = ["B008"]  # FastAPI 依赖注入的默认值写法

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = false
explicit_package_bases = true
mypy_path = "."
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.services.*", "app.agents.*"]
strict = true

[[tool.mypy.overrides]]
module = ["app.infra.db.migrations.*"]
ignore_errors = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "分层：api -> services -> domain；infra 实现 domain"
type = "layers"
layers = ["app.api", "app.services", "app.domain"]

[[tool.importlinter.contracts]]
name = "infra 只能依赖 domain 与 core（不反向依赖 api/services）"
type = "layers"
layers = ["app.api", "app.services", "app.infra", "app.domain"]

[[tool.importlinter.contracts]]
name = "domain 不依赖框架与基础设施"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "httpx",
    "app.infra",
    "app.services",
    "app.api",
]

[[tool.importlinter.contracts]]
name = "api 不直接 import infra（通过 deps 注入端口实现）"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.infra"]
allow_indirect_imports = true

[tool.bandit]
exclude_dirs = ["tests", "app/infra/db/migrations"]
