# SSE 专用：关闭一切缓冲，放宽超时（覆盖审批等待 180s 与长任务）
# 场景：
#   1) GET /api/threads/{id}/events/stream        会话事件流（前端主链路）
#   2) GET /api/v1/runs/{id}/events/stream        断线重放（Last-Event-ID）
#   3) POST /api/v1/artifacts/{id}/regenerate     产物重新生成
proxy_buffering off;
proxy_cache off;
proxy_request_buffering off;
gzip off;
chunked_transfer_encoding on;
proxy_read_timeout 360s;
proxy_send_timeout 360s;
# 同时给上游与客户端去缓冲信号
proxy_set_header X-Accel-Buffering no;
add_header X-Accel-Buffering no always;
